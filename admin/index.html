<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة | جدارة الأداء</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-light.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- ========== LOGIN ========== -->
  <div id="loginView" class="view view--login">
    <div class="login__card">
      <img src="/assets/jadara-logo-light.svg" alt="جدارة" class="login__logo">
      <h1 class="login__title">لوحة الإدارة</h1>
      <p class="login__subtitle">سجّل دخولك لإدارة طلبات العملاء</p>
      <form id="loginForm" class="login__form" autocomplete="off">
        <div class="field">
          <label for="loginUser">اسم المستخدم</label>
          <input type="text" id="loginUser" name="username" required autocomplete="username">
        </div>
        <div class="field">
          <label for="loginPass">كلمة المرور</label>
          <input type="password" id="loginPass" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login" id="loginBtn">تسجيل الدخول</button>
        <p id="loginError" class="login__error"></p>
      </form>
    </div>
  </div>

  <!-- ========== DASHBOARD ========== -->
  <div id="adminView" class="view view--admin">

    <!-- Header -->
    <header class="header">
      <div class="header__inner">
        <div class="header__start">
          <img src="/assets/jadara-logo-light.svg" alt="جدارة" class="header__logo">
          <span class="header__sep"></span>
          <span class="header__title">لوحة الإدارة</span>
        </div>
        <div class="header__end">
          <span class="header__user" id="adminUsername"></span>
          <button class="btn-logout" id="logoutBtn">تسجيل الخروج</button>
        </div>
      </div>
    </header>

    <main class="main">

      <!-- Stats (always visible) -->
      <section class="stats-row">
        <div class="stat-card stat-card--total">
          <div class="stat-card__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
          </div>
          <div class="stat-card__body">
            <span class="stat-card__number" id="statTotal">0</span>
            <span class="stat-card__label">إجمالي الطلبات</span>
          </div>
        </div>
        <div class="stat-card stat-card--new">
          <div class="stat-card__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          </div>
          <div class="stat-card__body">
            <span class="stat-card__number" id="statNew">0</span>
            <span class="stat-card__label">جديد</span>
          </div>
        </div>
        <div class="stat-card stat-card--review">
          <div class="stat-card__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          </div>
          <div class="stat-card__body">
            <span class="stat-card__number" id="statReview">0</span>
            <span class="stat-card__label">قيد المراجعة</span>
          </div>
        </div>
        <div class="stat-card stat-card--contacted">
          <div class="stat-card__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.86 19.86 0 0 1 3.09 5.18 2 2 0 0 1 5.11 3h3a2 2 0 0 1 2 1.72c.13.81.36 1.6.68 2.34a2 2 0 0 1-.45 2.11L8.91 10.6a16 16 0 0 0 6.49 6.49l1.43-1.43a2 2 0 0 1 2.11-.45c.74.32 1.53.55 2.34.68a2 2 0 0 1 1.72 2.03z"/></svg>
          </div>
          <div class="stat-card__body">
            <span class="stat-card__number" id="statContacted">0</span>
            <span class="stat-card__label">تم التواصل</span>
          </div>
        </div>
        <div class="stat-card stat-card--closed">
          <div class="stat-card__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div class="stat-card__body">
            <span class="stat-card__number" id="statClosed">0</span>
            <span class="stat-card__label">مغلق</span>
          </div>
        </div>
        <div class="stat-card stat-card--today">
          <div class="stat-card__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
          <div class="stat-card__body">
            <span class="stat-card__number" id="statToday">0</span>
            <span class="stat-card__label">اليوم</span>
          </div>
        </div>
      </section>

      <!-- ===== LIST PAGE ===== -->
      <section id="listPage" class="page page--active">
        <div class="toolbar">
          <div class="toolbar__start">
            <h2 class="toolbar__title">الطلبات الواردة</h2>
          </div>
          <div class="toolbar__end">
            <input type="search" id="searchInput" class="toolbar__search" placeholder="بحث بالاسم أو البريد أو الهاتف...">
            <select id="statusFilter" class="toolbar__select">
              <option value="">جميع الحالات</option>
              <option value="new">جديد</option>
              <option value="in_review">قيد المراجعة</option>
              <option value="contacted">تم التواصل</option>
              <option value="closed">مغلق</option>
            </select>
            <button id="exportBtn" class="btn-export">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              تصدير CSV
            </button>
          </div>
        </div>
        <div class="table-section">
          <div class="table-wrap">
            <table class="table" id="leadsTable">
              <thead>
                <tr>
                  <th>#</th>
                  <th>الاسم</th>
                  <th>الشركة</th>
                  <th>البريد الإلكتروني</th>
                  <th>الهاتف</th>
                  <th>الحالة</th>
                  <th>التاريخ</th>
                  <th>الاستبيان</th>
                </tr>
              </thead>
              <tbody id="leadsBody"></tbody>
            </table>
          </div>
          <p id="emptyState" class="empty-state">لا توجد طلبات بعد</p>
        </div>
      </section>

      <!-- ===== DETAIL PAGE ===== -->
      <section id="detailPage" class="page">
        <button class="btn-back" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          رجوع للقائمة
        </button>
        <div class="detail-page" id="detailContent"></div>
      </section>

    </main>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
